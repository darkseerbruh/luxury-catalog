name: Refresh myGemma handbag listings (Awin feed)

# Hands-off daily capture for myGemma via its LICENSED Awin product datafeed (Google/
# Enhanced format, feed F512) — the same shape TLC gets from CJ. Replaces the old Shopify
# crawl: every listing now arrives with a feed-licensed image_link + Awin's tracked deep
# link, so the bag-page rail shows a photo and each buy-link is commission-tracked.
# Each run: fetch the feed -> map bags we can name (canonicalModel) with condition ->
# load into price_history + bank unnamable bags to discovered_listing -> load listing
# photos -> retire sold -> refresh the per-variant summary. See
# docs/priority-reseller-capture-runbook.md.
#
# SECRETS: SUPABASE_SERVICE_ROLE_KEY (set) + AWIN_MYGEMMA_FEED_URL (the Create-a-Feed
# download URL; it embeds our Awin feed API key — same idea as TLC's CJ_API_TOKEN).

on:
  schedule:
    # Daily, 07:17 UTC, off the hour and staggered from the other feeds.
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      write:
        description: "Apply DB writes? false = fetch + map + report only (no load/reconcile)"
        required: false
        default: "true"

concurrency:
  group: mygemma-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://pewmdztviyrtbhtebcct.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AWIN_MYGEMMA_FEED_URL: ${{ secrets.AWIN_MYGEMMA_FEED_URL }}
      WRITE: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.write }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch the Awin datafeed + map bags into landing observations (+ images)
        run: npx tsx supabase/ingest/sources/mygemma-awin.ts

      - name: Load prices + bank discovered + load photos + retire sold + refresh summary
        if: env.WRITE == 'true'
        run: |
          npm run load:prices -- mygemma --write
          npm run load:prices -- mygemma-discovered --discovered-only --write
          npm run load:listing-images -- myGemma --write
          npm run reconcile:sold -- --platform=myGemma --snapshot=data/ingest/_raw/mygemma-live.json --write
          npm run summary:refresh
