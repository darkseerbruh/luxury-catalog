name: Refresh market listings (The RealReal)

# Hands-off "drop sold bags off the Shop" job for TheRealReal, the sister of
# market-refresh.yml (Fashionphile). TRR is PerimeterX-blocked to plain fetch, so
# this refresh runs the cloud Apify actor `lulzasaur/therealreal-scraper` over TRR's
# handbag categories (residential proxy, no browser), loads the live listings, and
# retires the ones our catalogue still shows that the fresh sweep no longer sees.
#
# CADENCE: every 2 days. TRR's live inventory is smaller and churns slower than
# Fashionphile's (which runs every 3h), so 2 days keeps a sold bag from lingering
# more than ~48h without over-spending. Tune the cron below.
#
# COST: the actor is pay-per-result (~$0.005/listing). A full handbag sweep is
# ~800-960 listings, so ~$4-5/run, ~$60/mo at this cadence (owner-greenlit 2026-07-09).
#
# INTEGRITY: the fetch writes trr-live-refs.json (listing_ref = sku ?? url per record,
# exactly the loader's key) as the reconcile snapshot, so reconcile compares like for
# like. reconcile also SKIPS retirement if the snapshot would drop >50% of TRR's live
# rows (a broken sweep never mass-retires). The category list mirrors the bag-only
# universe our TRR rows came from, so the live set is comprehensive for what's stored.
#
# SECRETS: SUPABASE_SERVICE_ROLE_KEY (already set) + APIFY_TOKEN (ADD THIS in repo
# Settings -> Secrets -> Actions; it's the token from the Apify console). The Supabase
# URL is public (NEXT_PUBLIC_*), inlined as a fallback below.
#
# Runs on a schedule AND on demand (Actions tab -> this workflow -> "Run workflow").

on:
  schedule:
    # Every 2 days, 04:31 UTC. Tune up/down here.
    - cron: "31 4 */2 * *"
  workflow_dispatch:
    inputs:
      write:
        description: "Apply changes? false = dry run (fetch + report only, no DB writes)"
        required: false
        default: "true"

# Never let two TRR refreshes overlap (they touch the same listings).
concurrency:
  group: trr-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://pewmdztviyrtbhtebcct.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      # Scheduled runs always write; manual runs honour the dry-run toggle.
      WRITE: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.write }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch TRR live inventory via Apify (writes raw + reconcile snapshot)
        run: npx tsx supabase/ingest/sources/apify-trr-refresh.ts

      - name: Map + load the live listings
        run: |
          npx tsx supabase/ingest/sources/trr-apify.ts trr-apify-live
          if [ "$WRITE" = "true" ]; then
            npx tsx supabase/ingest/load-prices.ts therealreal --write
          else
            npx tsx supabase/ingest/load-prices.ts therealreal
          fi

      - name: Retire sold / pulled listings
        run: |
          SNAP=data/ingest/_raw/trr-live-refs.json
          if [ "$WRITE" = "true" ]; then
            npm run reconcile:sold -- --platform=RealReal --snapshot="$SNAP" --write
          else
            npm run reconcile:sold -- --platform=RealReal --snapshot="$SNAP"
          fi

      - name: Refresh price summaries
        if: ${{ env.WRITE == 'true' }}
        run: npm run summary:refresh
