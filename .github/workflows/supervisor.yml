name: Supervisor (triage and self-repair)

# The autonomy layer. Runs Claude Code headlessly on a schedule, reads what is
# red or silent, fixes it, and lands the fix. Built 2026-08-27 on the owner's
# standing instruction: the system triages and repairs itself and reaches her
# only for things a human is structurally required to do.
#
# It runs in GitHub Actions on purpose. The twelve local scheduled tasks ran on
# her Mac and went silent for ten days when it closed; every cloud workflow kept
# running through the same month. The host was the bug, so the supervisor lives
# where the laptop cannot take it down.
#
# Doctrine: docs/supervisor-standard.md (what it may do, what it must escalate,
# and the proof-before-ship rules that replace having a human in the loop).
# Anything it cannot fix lands in docs/escalation-queue.md and is retried.

on:
  schedule:
    # Every 6 hours, offset off the :00 mark and away from the capture cluster.
    - cron: "23 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Diagnose and report, but land nothing"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write
  pull-requests: write

concurrency:
  # Never two supervisors at once: they would race on branches and land
  # conflicting fixes for the same problem.
  group: supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Refresh the sentinels so the supervisor reads current state
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CJ_API_TOKEN: ${{ secrets.CJ_API_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          AWIN_MYGEMMA_FEED_URL: ${{ secrets.AWIN_MYGEMMA_FEED_URL }}
        run: |
          npx tsx scripts/watchdog.ts --write || true
          npx tsx scripts/credential-radar.ts --write || true

      - name: Configure git for the bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - id: run
        name: Run the supervisor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CJ_API_TOKEN: ${{ secrets.CJ_API_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          AWIN_MYGEMMA_FEED_URL: ${{ secrets.AWIN_MYGEMMA_FEED_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # The exit code MUST survive the pipe. Piping into tee and then
          # trusting $? reports the PIPE's status, which is the exact "false
          # green" bug that made a failed landing look successful in July, and
          # which the supervisor's own first run caught here. A self-repair loop
          # that cannot see its own failure is worse than no loop at all.
          set -uo pipefail
          claude -p "$(cat .github/supervisor-prompt.md)" \
            --model opus \
            --permission-mode bypassPermissions \
            --output-format text \
            2>&1 | tee supervisor-run.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Supervisor exited $code"
          exit "$code"

      - name: Write the heartbeat (always, and truthfully)
        if: always()
        env:
          # The supervisor's OWN exit code, not job.status. job.status is
          # 'success' while the job is still running, so it reported green for a
          # crashed run. A heartbeat that lies is the failure this whole layer
          # exists to prevent.
          CODE: ${{ steps.run.outputs.exit_code }}
        run: |
          mkdir -p reports/heartbeat
          result="failure"
          [ "${CODE:-1}" = "0" ] && result="success"
          cat > reports/heartbeat/supervisor.json <<EOF
          {
            "at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "engine": "supervisor",
            "result": "$result",
            "exitCode": ${CODE:-null},
            "run": "${{ github.run_id }}"
          }
          EOF
          cat reports/heartbeat/supervisor.json

      - name: Commit whatever the run produced
        if: always()
        run: |
          set -euo pipefail
          git add reports docs/escalation-queue.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore(supervisor): run $(date -u +%F-%H%M)"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase
          done
          git push

      - name: Surface a failed supervisor loudly
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create supervisor --force \
            --description "The self-repair loop itself failed" --color B60205 >/dev/null 2>&1 || true
          title="Supervisor run failed"
          existing=$(gh issue list --label supervisor --state open --json title,number \
            -q ".[] | select(.title == \"$title\") | .number" | head -1)
          body="The supervisor loop itself failed on run ${{ github.run_id }}. Nothing else will be triaged until this is fixed, so this is the one alarm that must never be ignored."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: run ${{ github.run_id }}."
          else
            gh issue create --title "$title" --label supervisor --body "$body"
          fi
