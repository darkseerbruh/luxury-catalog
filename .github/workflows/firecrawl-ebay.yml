name: Firecrawl capture (eBay sold-sweep)

# eBay is the realized-SOLD lane (see docs/priority-reseller-capture-runbook.md). It runs
# WEEKLY (not nightly) and scoped to the hero list, because eBay sold data is
# counterfeit-noisy and worth less fresh than the daily reseller snapshot.
#
# SCHEDULED RUNS ARE REPORT-ONLY (WRITE=false): they capture a landing snapshot + print row
# counts / credit burn, but write nothing. The --sold parse (LH_Sold+Complete, masked
# best-offer dropped) has not had a live CI verification yet, so the first weekly reports
# are for review. To PROMOTE the lane to writing: review a run's snapshot, then dispatch
# manually with write=true (or flip the schedule WRITE below). Validate-first, like
# firecrawl-capture.yml. eBay item pages 403 plain fetch; Firecrawl defeats the block.
#
# Per item ≈ 1 markdown scrape (~1 credit). Hero list, limit 15/style ≈ ~14 styles × 15 +
# 14 searches ≈ a few hundred credits/week. Watch real burn in the run log.
#
# SECRETS: FIRECRAWL_API_KEY + SUPABASE_SERVICE_ROLE_KEY (set). ANTHROPIC_API_KEY is
# optional — the LLM description pass is skipped if it's absent.

on:
  schedule:
    # Weekly, Monday 07:37 UTC, off the hour. Report-only by default (WRITE forced false
    # on schedule below) until the --sold parse is verified from a run's snapshot.
    - cron: "37 7 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: "eBay target key (firecrawl-ebay TARGETS), or 'all' for the hero list"
        required: false
        default: "all"
      limit:
        description: "Max item scrapes per style (credit ceiling)"
        required: false
        default: "15"
      sold:
        description: "Capture SOLD comps (LH_Sold+Complete)? false = live asks"
        required: false
        default: "true"
      write:
        description: "Apply DB writes? false = capture + report only"
        required: false
        default: "false"

concurrency:
  group: firecrawl-ebay
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://pewmdztviyrtbhtebcct.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TARGET: ${{ github.event.inputs.target || 'all' }}
      LIMIT: ${{ github.event.inputs.limit || '15' }}
      # Weekly sold-sweep: scheduled runs capture SOLD comps but WRITE nothing (report-only)
      # until the --sold parse is verified. Manual dispatch honours both toggles.
      SOLD: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.sold }}
      WRITE: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.write }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fail early if the Firecrawl key is missing
        run: |
          if [ -z "$FIRECRAWL_API_KEY" ]; then
            echo "::error::FIRECRAWL_API_KEY secret is not set (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - name: Capture eBay via Firecrawl (writes landing snapshot)
        run: npx tsx supabase/ingest/sources/firecrawl-ebay.ts "$TARGET" --limit="$LIMIT" ${{ env.SOLD == 'true' && '--sold' || '' }}

      - name: Load prices + refresh summary
        if: env.WRITE == 'true'
        run: |
          npm run load:prices -- ebay --write
          npm run summary:refresh

      - name: Mine description facts with the LLM pass (skipped if no key)
        if: env.WRITE == 'true' && env.ANTHROPIC_API_KEY != ''
        run: npm run enrich:descriptions -- --platform=ebay --limit=200 --write
