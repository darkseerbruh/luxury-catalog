name: Firecrawl capture (eBay — manual fallback)

# DISPATCH-ONLY, owner-gated. The PRIMARY eBay realized-sold engine is Apify auction-only
# (ebay-sold-apify.ts, best-offer masking can't occur). This Firecrawl path is a MANUAL
# BACKUP for when Apify is capped: it does live asks by default, or --sold (LH_Sold+Complete)
# as a weaker sold fallback (includes Buy-It-Now, so it only heuristically drops masked
# best-offer rows). No schedule — fire from Actions -> Run workflow when you actually need it,
# so it never burns Firecrawl credits redundantly against Apify. See
# docs/priority-reseller-capture-runbook.md. eBay item pages 403 plain fetch; Firecrawl defeats it.
#
# Per item ≈ 1 markdown scrape (~1 credit). SECRETS: FIRECRAWL_API_KEY + SUPABASE_SERVICE_ROLE_KEY
# (set). ANTHROPIC_API_KEY optional — the LLM description pass is skipped if it's absent.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "eBay target key (firecrawl-ebay TARGETS), or 'all' for the hero list"
        required: false
        default: "all"
      limit:
        description: "Max item scrapes per style (credit ceiling)"
        required: false
        default: "15"
      sold:
        description: "Capture SOLD comps (LH_Sold+Complete)? false = live asks"
        required: false
        default: "true"
      write:
        description: "Apply DB writes? false = capture + report only"
        required: false
        default: "false"

concurrency:
  group: firecrawl-ebay
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://pewmdztviyrtbhtebcct.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TARGET: ${{ github.event.inputs.target || 'all' }}
      LIMIT: ${{ github.event.inputs.limit || '15' }}
      # Weekly sold-sweep: scheduled runs capture SOLD comps but WRITE nothing (report-only)
      # until the --sold parse is verified. Manual dispatch honours both toggles.
      SOLD: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.sold }}
      WRITE: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.write }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fail early if the Firecrawl key is missing
        run: |
          if [ -z "$FIRECRAWL_API_KEY" ]; then
            echo "::error::FIRECRAWL_API_KEY secret is not set (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - name: Capture eBay via Firecrawl (writes landing snapshot)
        run: npx tsx supabase/ingest/sources/firecrawl-ebay.ts "$TARGET" --limit="$LIMIT" ${{ env.SOLD == 'true' && '--sold' || '' }}

      - name: Load prices + refresh summary
        if: env.WRITE == 'true'
        run: |
          npm run load:prices -- ebay --write
          npm run summary:refresh

      - name: Mine description facts with the LLM pass (skipped if no key)
        if: env.WRITE == 'true' && env.ANTHROPIC_API_KEY != ''
        run: npm run enrich:descriptions -- --platform=ebay --limit=200 --write
