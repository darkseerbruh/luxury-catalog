name: Probe Google Trends reachability

# One-off diagnostic, not part of the pipeline. Google Trends has no official API.
# The unofficial endpoint answers the "explore" step but returns 429 on the data
# step from a residential IP, even after 45s of backoff. The attention series would
# run from Actions, so this settles whether a runner IP fares any better before we
# build an ingest against a source we cannot reach.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Two-step Google Trends fetch
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          curl -s -c /tmp/c.txt -A "$UA" --max-time 30 \
            "https://trends.google.com/trends/explore?q=chanel%20classic%20flap" -o /dev/null \
            -w "warmup HTTP %{http_code}\n"
          sleep 4
          REQ='{"comparisonItem":[{"keyword":"Chanel Classic Flap","geo":"US","time":"today 5-y"}],"category":0,"property":""}'
          curl -s -b /tmp/c.txt -A "$UA" -H "Referer: https://trends.google.com/trends/explore" --max-time 30 \
            --get --data-urlencode "req=$REQ" --data "hl=en-US&tz=0" \
            "https://trends.google.com/trends/api/explore" -o /tmp/e.json \
            -w "explore HTTP %{http_code}\n"
          python3 - <<'PY'
          import json
          raw=open("/tmp/e.json").read()
          if not raw.startswith(")]}'"):
              print("explore blocked:", raw[:120]); raise SystemExit(0)
          d=json.loads(raw[raw.index("{"):])
          w=[x for x in d["widgets"] if x.get("id")=="TIMESERIES"][0]
          open("/tmp/tok","w").write(w["token"])
          open("/tmp/req","w").write(json.dumps(w["request"]))
          print("got TIMESERIES token")
          PY
          sleep 6
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          curl -s -b /tmp/c.txt -A "$UA" -H "Referer: https://trends.google.com/trends/explore" --max-time 30 \
            --get --data-urlencode "req=$(cat /tmp/req)" --data-urlencode "token=$(cat /tmp/tok)" \
            --data "hl=en-US&tz=0" \
            "https://trends.google.com/trends/api/widgetdata/multiline" -o /tmp/m.json \
            -w "multiline HTTP %{http_code}\n"
          python3 - <<'PY'
          raw=open("/tmp/m.json").read()
          if raw.startswith(")]}'"):
              import json
              pts=json.loads(raw[raw.index("{"):])["default"]["timelineData"]
              vals=[p["value"][0] for p in pts]
              print(f"✅ VIABLE FROM ACTIONS: {len(pts)} weekly points, {pts[0]['formattedTime']} to {pts[-1]['formattedTime']}")
              print(f"   first 12wk avg {sum(vals[:12])/12:.1f} -> last 12wk avg {sum(vals[-12:])/12:.1f}")
          else:
              print("❌ BLOCKED FROM ACTIONS TOO:", raw[:120])
          PY
