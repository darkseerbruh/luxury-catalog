name: Refresh Couture USA live listings (Shopify feed)

# Hands-off daily capture for Couture USA (open-Shopify consignor, broad mid-to-high stock).
# FREE, no Firecrawl/Apify. Each run: crawl the whole feed -> map bags we can name
# (canonicalModel, footwear filtered out) -> load into price_history -> retire listings the
# crawl no longer sees (sold/pulled) -> refresh the per-variant summary. See
# docs/priority-reseller-capture-runbook.md.
#
# SECRETS: only SUPABASE_SERVICE_ROLE_KEY (already set). Supabase URL is public
# (NEXT_PUBLIC_*), inlined as a fallback — mirrors redeluxe-refresh.yml / market-refresh.yml.

on:
  schedule:
    # Daily, 06:53 UTC, off the hour and staggered from Fashionphile/Redeluxe.
    - cron: "53 6 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Crawl page cap (safety ceiling)"
        required: false
        default: "200"
      write:
        description: "Apply DB writes? false = crawl + report only (no load/reconcile)"
        required: false
        default: "true"

concurrency:
  group: couture-usa-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://pewmdztviyrtbhtebcct.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MAX_PAGES: ${{ github.event.inputs.max_pages || '200' }}
      WRITE: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.write }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Crawl Couture USA live feed (writes raw dump + live snapshot)
        run: npx tsx supabase/ingest/sources/couture-usa-crawl.ts --max-pages="$MAX_PAGES"

      - name: Map bags into landing observations
        run: npx tsx supabase/ingest/sources/couture-usa.ts --raw

      - name: Load prices + retire sold + refresh summary
        if: env.WRITE == 'true'
        run: |
          npm run load:prices -- couture-usa --write
          npm run reconcile:sold -- --platform="Couture USA" --snapshot=data/ingest/_raw/couture-usa-live.json --write
          npm run summary:refresh
