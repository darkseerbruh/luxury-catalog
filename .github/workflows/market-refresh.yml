name: Refresh market listings (Fashionphile)

# Hands-off "drop sold bags off the Shop" job. Re-crawls Fashionphile's live
# inventory and retires the listings we still show that the crawl no longer sees
# (sold / pulled) — so the Shop reflects what's actually for sale, untouched by hand.
#
# SCOPE (updated 2026-07-08, owner directive "pull them all"): every run retires sold
# listings; ONCE DAILY (the 05:xx UTC run) it also loads the WHOLE live catalogue's
# prices — curated listings refresh their known styles, everything unmatched banks to
# discovered_listing for promotion. The old "sold-only" scope is retired: we now ingest
# the full market, not a hand-picked style list.
#
# GROWTH NOTE: a full load appends ~13.5k rows/day (each day's snapshot of a live
# listing is a new row). The LC Index RPC dedupes by listing_ref (keeps the latest), so
# medians stay honest, but price_history grows ~400k rows/month. The load is gated to
# ONCE daily to bound this; tune the gate hour below, or add a prune of superseded
# same-listing_ref observations if the table needs trimming.
#
# Runs on a schedule AND on demand (Actions tab -> this workflow -> "Run workflow").
# Fashionphile is the only source crawlable headless in CI today; TheRealReal /
# Vestiaire still need a browser session, so they're reconciled manually for now.
#
# SECRETS: needs only SUPABASE_SERVICE_ROLE_KEY (already set on this repo). The
# Supabase URL is public (NEXT_PUBLIC_*), so it's inlined as a fallback below — no
# secret required; override with a NEXT_PUBLIC_SUPABASE_URL secret if the project
# ref ever changes. (Mirrors classify-families.yml.)

on:
  schedule:
    # Every 3 hours (listings sell hourly, so retire sold Fashionphile listings fast — this is
    # the only source crawlable headless). Off the :00 mark. Tune up/down here.
    - cron: "17 */3 * * *"
    # Once daily at 05:17 UTC: ALSO load the full live catalogue's prices (the freshness
    # source). Its own cron because `*/3` never lands on hour 05, so the old hour==05 gate
    # never fired and Fashionphile freshness silently froze (2026-07-10..14).
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      collection:
        description: "Fashionphile collection slug to crawl (default: handbags = all bags)"
        required: false
        default: "handbags"
      write:
        description: "Apply changes? false = dry run (crawl + report only, no DB writes)"
        required: false
        default: "true"
      full_load:
        description: "Load the full catalogue's prices this run? auto = only the daily 05:xx run; true = force now; false = sold-reconcile only"
        required: false
        default: "auto"

# Never let two refreshes overlap (they touch the same listings).
concurrency:
  group: market-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://pewmdztviyrtbhtebcct.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COLLECTION: ${{ github.event.inputs.collection || 'handbags' }}
      # Scheduled runs always write; manual runs honour the dry-run toggle.
      WRITE: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.write }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Crawl Fashionphile live inventory (writes the live snapshot)
        run: npx tsx supabase/ingest/sources/fashionphile-crawl.ts "$COLLECTION"

      - name: Retire sold / pulled listings
        run: |
          SNAP=data/ingest/_raw/fashionphile-live.json
          if [ "$WRITE" = "true" ]; then
            npm run reconcile:sold -- --platform=fashionphile --snapshot="$SNAP" --write
          else
            npm run reconcile:sold -- --platform=fashionphile --snapshot="$SNAP"
          fi

      - name: Load the full catalogue's prices (once daily)
        env:
          FULL_LOAD: ${{ github.event.inputs.full_load || 'auto' }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          # auto = load only on the dedicated daily 05:17 cron; true = force; false = skip.
          # Gate on the triggering cron STRING, not wall-clock hour: a delayed Actions run
          # would miss an exact-hour match and silently skip the load. (Empty on manual
          # dispatch, so a manual run must pass full_load=true to load.)
          if [ "$FULL_LOAD" = "false" ]; then echo "full_load=false — skipping full price load."; exit 0; fi
          if [ "$FULL_LOAD" != "true" ] && [ "$TRIGGER_CRON" != "17 5 * * *" ]; then
            echo "full_load=auto and trigger='$TRIGGER_CRON' (not the daily load cron) — sold-reconcile only this run."; exit 0
          fi
          if [ "$WRITE" != "true" ]; then echo "Dry run — skipping DB writes for the full load."; exit 0; fi
          echo "Loading the full live catalogue's prices..."
          # The crawl above already wrote the raw dump. Curated listings -> known styles;
          # the catch-all pass banks everything unmatched to discovered_listing.
          npx tsx supabase/ingest/sources/fashionphile.ts --raw
          npx tsx supabase/ingest/load-prices.ts fashionphile --write
          npx tsx supabase/ingest/sources/fashionphile.ts --catch-all
          npx tsx supabase/ingest/load-prices.ts fashionphile --discovered-only --write
          npm run summary:refresh
